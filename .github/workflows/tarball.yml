name: Tarball

# A tarball to unpack and play anywhere, for amd64 and arm64, attached to
# each GitHub release (or kept as an artifact when run by hand).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarball:
    name: Build the tarball (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit and tag, so tools/version.sh can describe this one.
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build meson pkg-config python3-pil python3-numpy python3-fonttools glslang-tools bc \
            libembree-dev libtbb-dev zlib1g-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl-dev libdbus-1-dev libudev-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libvorbis-dev libopusfile-dev libflac-dev libmpg123-dev
      - uses: actions/cache@v4
        with:
          path: |
            build/prefix
            build/bin
          key: deps-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('tools/versions.sh', 'tools/deps.sh', 'tools/tools.sh') }}
      - name: Build
        run: make -j1 JOBS=$(nproc)
      - name: Pack
        id: pack
        run: echo "file=$(make -s tarball | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cinderkirk-tarball-${{ matrix.arch }}
          path: ${{ steps.pack.outputs.file }}
          compression-level: 0
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.pack.outputs.file }}" --clobber
