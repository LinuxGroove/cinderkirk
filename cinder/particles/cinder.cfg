// Cinderkirk's particle effects, read by the engine when r_particledesc
// names "cinder" (default.cfg). Anything not defined here falls back to
// the classic effects. Format: FTE particle scripts.

// Scattergun pellets and bolts hitting stone: a few hot sparks and a puff
// of grit, instead of Quake's dark specks. The engine asks for 20 of a
// gunshot, so counts here are per twentieth.
r_part te_gunshot
{
	type spark
	count 0.8
	scale 1
	scalefactor 1
	alpha 1
	die 0.15 0.35
	rgb 255 200 120
	rgbdelta 0 -400 -600
	spawnorg 1
	spawnvel 140
	veladd 40
	gravity 800
	friction 1
	blend add
}
r_part +te_gunshot
{
	texture "ball"
	count 0.25
	scale 10 16
	scalefactor 1
	scaledelta 36
	alpha 0.4
	die 0.45 0.7
	rgb 120 105 90
	spawnorg 3
	veladd 18
	gravity -30
	friction 2
	blend blend
}

// Spitter nails: a short spray of hot flecks.
r_part te_spike
{
	type spark
	count 5
	scale 1
	alpha 1
	die 0.1 0.25
	rgb 255 170 90
	rgbdelta 0 -500 -700
	spawnorg 1
	spawnvel 110
	veladd 30
	gravity 800
	blend add
}
r_part +te_spike
{
	texture "ball"
	count 1
	scale 8 12
	scaledelta 30
	alpha 0.35
	die 0.4 0.6
	rgb 140 120 100
	spawnorg 2
	veladd 12
	gravity -30
	blend blend
}
r_part te_superspike
{
	assoc te_spike
	type spark
	count 9
	scale 1
	alpha 1
	die 0.15 0.3
	rgb 255 180 100
	rgbdelta 0 -450 -650
	spawnorg 1
	spawnvel 150
	veladd 40
	gravity 800
	blend add
}
