// Cinderkirk default settings. Players' own changes go in cinderkirk.cfg.
unbindall

// Keyboard and mouse
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind UPARROW "+forward"
bind DOWNARROW "+back"
bind LEFTARROW "+left"
bind RIGHTARROW "+right"
bind SPACE "+jump"
bind MOUSE2 "impulse 21"	// Overpressure
bind SHIFT "impulse 20"	// Bellows dash
bind CTRL "+speed"	// walk (running is the default)
bind ALT "+strafe"
bind e "+moveup"
bind c "+movedown"
bind MOUSE1 "+attack"
bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind q "+wheel"	// hold for the weapon wheel, tap for the last weapon
bind MWHEELUP "impulse 12"
bind MWHEELDOWN "impulse 10"
bind TAB "+showscores"
bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind t "messagemode"
bind PAUSE "pause"
bind F2 "menu_save"
bind F3 "menu_load"
bind F4 "menu_options"
bind F6 "echo Saved; save quick"
bind F9 "echo Loading; load quick"
bind F12 "screenshot"
bind PRINTSCREEN "screenshot"

// Controller: left stick moves, right stick (or gyro) looks
bind ABUTTON "+jump"
bind BBUTTON "impulse 20"	// Bellows dash
bind LTHUMB "+speed"	// walk
bind RTRIGGER "+attack"
bind LTRIGGER "impulse 21"	// Overpressure
bind RSHOULDER "impulse 10"
bind LSHOULDER "+wheel"	// hold for the weapon wheel, tap for the last weapon
bind DPAD_UP "impulse 2"
bind DPAD_RIGHT "impulse 4"
bind DPAD_DOWN "impulse 6"
bind DPAD_LEFT "impulse 8"
bind YBUTTON "+showscores"
joy_enable 1
joy_rumble 0.5
gyro_enable 1
joy_flick 0
cl_alwaysrun 1
+mlook

// Comfort: no view bob, roll, kick or flashes by default (see README)
cl_bob 0
cl_bobcycle 0
cl_rollangle 0
v_kicktime 0
v_gunkick 0
v_idlescale 0
cl_sidespeed 400
fov 100

// Looks
scr_style 3	// the Foundry status bar
r_wateralpha 1
r_lavaalpha 1
r_slimealpha 1
r_telealpha 1

crosshair 1
scr_conalpha 0.8
gamma 1
contrast 1
volume 0.7
sensitivity 4

name "Stoker"
